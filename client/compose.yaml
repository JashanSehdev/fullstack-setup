services:
  client:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: next-frontend
    restart: unless-stopped
    env_file:
      - .env.local
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    environment:
      NODE_ENV: development
      HOSTNAME: 0.0.0.0
      WATCHPACK_POLLING: "true"